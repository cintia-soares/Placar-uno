<style>
:root{--bg:#fff;--fg:#111;--card:#f2f2f2;--line:#d9d9d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f4f4f4;--card:#232323;--line:#3a3a3a}}
:root[data-theme="dark"]{--bg:#121212;--fg:#f4f4f4;--card:#232323;--line:#3a3a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Arial Black","Helvetica Neue",Arial,sans-serif}
#grid{display:grid;grid-template-columns:1fr 1fr;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));grid-auto-rows:minmax(0,1fr)}
.tile{border:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px;cursor:pointer;user-select:none;font-family:inherit;transition:filter .1s;container-type:size;touch-action:none;overflow:hidden}
.tile:active{filter:brightness(.88)}
.tile .n{font-weight:900;font-size:clamp(14px,min(17cqh,11cqw),64px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 10px;border-radius:10px;cursor:pointer}
.tile .s{font-weight:900;font-size:clamp(28px,min(48cqh,32cqw),150px);line-height:1}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:3px solid #000;background:#fff;color:#000;font-size:30px;line-height:1;display:grid;place-items:center;cursor:pointer;z-index:5;font-family:Arial,sans-serif}
#add{left:16px}#menu{right:16px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:480px;max-height:88dvh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));font-family:Arial,sans-serif}
.sheet h2{margin:0 0 14px;font-size:20px}
.sheet label{display:block;font-size:14px;margin:12px 0 6px}
.sheet input[type=text],.sheet input[type=number],.sheet select{width:100%;padding:12px;font-size:17px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.btn{display:block;width:100%;padding:14px;margin-top:10px;font-size:16px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font-family:inherit}
.btn.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.danger{color:#d12b2b}
.row{display:flex;gap:10px}.row .btn{margin-top:10px}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw i{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;outline:1px solid var(--line)}
.sw i.sel{border-color:var(--fg)}
.sw input[type=color]{width:42px;height:42px;border:0;padding:0;background:none}
table{width:100%;border-collapse:collapse;font-size:17px}
td,th{padding:10px 4px;text-align:center;border-bottom:1px solid var(--line)}
td:nth-child(2),th:nth-child(2){text-align:left}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.empty{text-align:center;padding:40px 20px;grid-column:1/3;align-self:center;font-family:Arial,sans-serif;font-size:18px}
.muted{font-size:13px;opacity:.7;margin-top:8px}.mrow{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.5}.mrow .row .btn{padding:9px;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div id="grid"></div>
<button class="fab" id="add" aria-label="Adicionar jogador">+</button>
<button class="fab" id="menu" aria-label="Menu">⋯</button>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
var PAL=['#ff0000','#0000ff','#9b45a0','#74b32c','#b8e000','#a9c7ec','#f5e900','#ff8c00','#ff4fa3','#00b8b0','#8b5a2b','#222222'];
var S={players:[],games:0};
try{var raw=localStorage.getItem('placar-uno');if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem('placar-uno',JSON.stringify(S))}catch(e){}}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}

  if(!S.players.some(function(p){return p.score>0})){show('<h2>Encerrar partida</h2><p>Ninguém pontuou nesta partida ainda.</p><button class="btn" id="cl">Fechar</button>');$('cl').onclick=close;return}
  var rows=S.players.slice().sort(function(a,b){return b.score-a.score}).map(function(p){return '<tr><td></td><td><span class="dot" style="background:'+p.color+'"></span>'+esc(p.name)+'</td><td>+'+p.score+'</td></tr>'}).join('');
  show('<h2>Encerrar partida</h2><table>'+rows+'</table><div class="muted">Os pontos vão para o ranking e a partida fica salva no histórico, onde você pode editar ou excluir.</div><button class="btn main" id="ok">Salvar partida e zerar placar</button><button class="btn" id="cl">Cancelar</button>');
  $('cl').onclick=close;
  $('ok').onclick=function(){var now=Date.now();hist().push({id:now,at:now,s:S.players.map(function(p){return {id:p.id,n:p.name,c:p.color,p:p.score,l:p.la||null}})});S.players.forEach(function(p){p.score=0;p.la=null});save();render();close();openRank()};
}
function openHist(){
  var h=hist().slice().sort(function(a,b){return b.at-a.at});
  if(!h.length){show('<h2>Histórico de partidas</h2><p>Nenhuma partida salva ainda.</p><button class="btn" id="cl">Fechar</button>');$('cl').onclick=close;return}
  var out='<h2>Histórico de partidas</h2>',mo='',dy='';
  h.forEach(function(m){var d=new Date(m.at),mk=cap(d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})),dk=cap(d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'}));
    if(mk!==mo){mo=mk;dy='';out+='<h3 style="margin:18px 0 2px">'+mk+'</h3>'}
    if(dk!==dy){dy=dk;out+='<div class="muted" style="margin-top:10px">'+dk+'</div>'}
    var sc=m.s.filter(function(e){return e.p>0}).sort(function(a,b){return b.p-a.p}).map(function(e){return '<span class="dot" style="background:'+cl2(e)+'"></span>'+esc(nm(e))+' '+e.p}).join(' &nbsp; ');
    out+='<div class="mrow"><b>'+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'</b> &nbsp; '+(sc||'Sem pontos')+'<div class="row"><button class="btn" onclick="editMatch('+m.id+')">Editar</button><button class="btn danger" onclick="delMatch('+m.id+',this)">Excluir</button></div></div>'});
  show(out+'<button class="btn" id="cl">Fechar</button>');$('cl').onclick=close;
}
function delMatch(id,b){if(!b.dataset.a){b.dataset.a=1;b.textContent='Toque de novo para excluir';return}
  S.history=hist().filter(function(m){return m.id!==id});save();openHist()}
function editMatch(id){
  var m=hist().filter(function(x){return x.id===id})[0];if(!m)return;
  var rows=m.s.map(function(e,i){return '<label><span class="dot" style="background:'+cl2(e)+'"></span>'+esc(nm(e))+'</label><input type="number" inputmode="numeric" min="0" id="ep'+i+'" value="'+e.p+'">'}).join('');
  show('<h2>Editar partida</h2><div class="muted">'+new Date(m.at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+'</div>'+rows+'<button class="btn main" id="ok">Salvar alterações</button><button class="btn" id="cl">Voltar</button>');
  $('cl').onclick=openHist;
  $('ok').onclick=function(){m.s.forEach(function(e,i){var v=parseInt($('ep'+i).value,10);e.p=(isNaN(v)||v<0)?0:v});save();openHist()};
}
function trophy(c,cx,cy,s,pos){
  var col=pos===1?'#f5c518':pos===2?'#c9ced6':'#cd7f32',dk=pos===1?'#b8860b':pos===2?'#8a919c':'#8b4f1d';
  c.save();c.translate(cx,cy);c.scale(s/100,s/100);
  c.lineWidth=9;c.strokeStyle=dk;
  c.beginPath();c.arc(-38,-14,20,Math.PI*.5,Math.PI*1.5);c.stroke();
  c.beginPath();c.arc(38,-14,20,-Math.PI*.5,Math.PI*.5);c.stroke();
  c.fillStyle=col;
  c.beginPath();c.moveTo(-40,-48);c.lineTo(40,-48);c.quadraticCurveTo(40,14,0,24);c.quadraticCurveTo(-40,14,-40,-48);c.closePath();c.fill();
  c.fillRect(-7,20,14,24);rr(c,-30,42,60,14,4);c.fill();
  c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(-20,-22,6,16,0,0,7);c.fill();
  c.restore()}
function shareImg(b,fb){try{var f=new File([b],'ranking-uno.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Ranking Uno'}).catch(function(){});return}}catch(e){}
  try{var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ranking-uno.png';document.body.appendChild(a);a.click();a.remove()}catch(e){fb()}}
$('add').onclick=openAdd;$('menu').onclick=openMenu;
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
render();
</script>
